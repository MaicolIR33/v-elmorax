<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velmorax | Recuperar clave</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}?v=20260804-reset-polish-8">
</head>
<body>
    <main class="login-shell login-shell-rich reset-shell">
        <section class="login-experience login-experience-single reset-experience">
            <aside class="login-panel login-panel-standalone reset-panel">
                <div class="reset-panel-heading">
                    <h3>Restablece tu clave y/o correo</h3>
                </div>
                <div class="reset-panel-layout">
                    <div class="reset-panel-main">
                        {% if error %}
                        <div class="flash-message flash-message-error" role="alert" aria-live="assertive">{{ error }}</div>
                        {% endif %}
                        {% if success %}
                        <div class="flash-message" role="status" aria-live="polite">{{ success }}</div>
                        {% endif %}
                        <div class="reset-form-card">
                            <form action="/password-reset" method="post" class="inventory-form login-form reset-form" data-login-form novalidate>
                                <div class="reset-request-row">
                                    <label class="reset-field reset-switch-field" data-email-field>
                                        <span>Correo de la cuenta</span>
                                        <input id="reset-email" type="email" name="email" placeholder="admin@velmorax.local" autocomplete="email" inputmode="email" spellcheck="false" required autofocus>
                                        <small class="reset-field-help">Usa el mismo correo con el que ingresas a Velmorax.</small>
                                    </label>
                                    <label class="reset-field reset-switch-field is-collapsed" data-phone-field>
                                        <span>Telefono</span>
                                        <input id="reset-phone" type="tel" name="phone" placeholder="+57 300 123 4567" autocomplete="tel" inputmode="tel" spellcheck="false">
                                        <small class="reset-field-help">Escribe el numero al que quieres enviar el enlace de recuperacion.</small>
                                    </label>
                                </div>
                                <div class="reset-method-group">
                                    <div class="reset-method-label">Metodo de recuperacion</div>
                                    <div class="reset-methods" data-reset-methods>
                                        <label class="reset-method-card is-selected">
                                            <input type="radio" name="method" value="email" checked {% if not email_enabled %}disabled{% endif %}>
                                            <span class="reset-method-indicator" aria-hidden="true"></span>
                                            <span class="reset-method-copy">
                                                <strong>Enviar por correo</strong>
                                                <small>
                                                    {% if email_enabled %}
                                                    Recibiras un enlace seguro en tu correo registrado.
                                                    {% else %}
                                                    Disponible cuando el correo saliente este configurado.
                                                    {% endif %}
                                                </small>
                                            </span>
                                        </label>
                                        <label class="reset-method-card">
                                            <input type="radio" name="method" value="phone">
                                            <span class="reset-method-indicator" aria-hidden="true"></span>
                                            <span class="reset-method-copy">
                                                <strong>Enviar por telefono</strong>
                                                <small>
                                                    {% if sms_enabled %}
                                                    Enviaremos el enlace seguro por SMS al numero registrado.
                                                    {% else %}
                                                    Opcion lista para SMS. Mientras tanto, si no esta configurado se entregara un enlace local temporal.
                                                    {% endif %}
                                                </small>
                                            </span>
                                        </label>
                                        {% if not email_enabled %}
                                        <label class="reset-method-card reset-method-card-local">
                                            <input type="radio" name="method" value="local">
                                            <span class="reset-method-indicator" aria-hidden="true"></span>
                                            <span class="reset-method-copy">
                                                <strong>Generar enlace local</strong>
                                                <small>Ideal para entorno interno o puesta en marcha sin correo saliente.</small>
                                            </span>
                                        </label>
                                        {% endif %}
                                    </div>
                                </div>
                                <div class="reset-actions">
                                    <button
                                        class="btn btn-primary btn-block login-submit"
                                        type="submit"
                                        data-submit-button
                                        data-submit-default="{% if email_enabled %}Continuar{% else %}Continuar{% endif %}"
                                        data-submit-loading="{% if email_enabled %}Procesando...{% else %}Procesando...{% endif %}"
                                    >
                                        Continuar
                                    </button>
                                    <a class="muted-line reset-back-link" href="/login">Volver al ingreso</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </aside>
        </section>
    </main>
    <script>
        const form = document.querySelector("[data-login-form]");
        const submitButton = document.querySelector("[data-submit-button]");
        const methodCards = [...document.querySelectorAll(".reset-method-card")];
        const methodRadios = [...document.querySelectorAll(".reset-method-card input[type='radio']")];
        const emailField = document.querySelector("[data-email-field]");
        const phoneField = document.querySelector("[data-phone-field]");
        const phoneInput = document.getElementById("reset-phone");
        const emailInput = document.getElementById("reset-email");

        const syncMethodCards = () => {
            methodCards.forEach((card) => {
                const radio = card.querySelector("input[type='radio']");
                card.classList.toggle("is-selected", Boolean(radio?.checked));
                card.classList.toggle("is-disabled", Boolean(radio?.disabled));
            });
            const selectedMethod = methodRadios.find((radio) => radio.checked)?.value || "email";
            const showPhone = selectedMethod === "phone";
            if (emailField && emailInput) {
                emailField.classList.toggle("is-collapsed", showPhone);
                emailInput.required = !showPhone;
            }
            if (phoneField && phoneInput) {
                phoneField.classList.toggle("is-collapsed", !showPhone);
                phoneInput.required = showPhone;
                if (!showPhone) {
                    phoneInput.value = "";
                }
            }
            if (showPhone && phoneInput) {
                phoneInput.focus();
            } else if (emailInput) {
                emailInput.focus();
            }
        };

        methodRadios.forEach((radio) => {
            radio.addEventListener("change", syncMethodCards);
        });
        syncMethodCards();

        if (form && submitButton) {
            form.addEventListener("submit", (event) => {
                if (!form.reportValidity()) {
                    event.preventDefault();
                    return;
                }
                submitButton.disabled = true;
                submitButton.classList.add("is-loading");
                submitButton.textContent = submitButton.dataset.submitLoading || "Enviando...";
            });
        }
    </script>
</body>
</html>
