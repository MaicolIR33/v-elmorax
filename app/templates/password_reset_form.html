<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velmorax | Nueva clave</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}?v=20260804-reset-polish-3">
</head>
<body>
    <main class="login-shell login-shell-rich reset-shell">
        <section class="login-experience login-experience-single reset-experience">
            <aside class="login-panel login-panel-standalone reset-panel">
                <div class="reset-panel-layout">
                    <div class="reset-panel-intro">
                        <div class="login-panel-top reset-panel-top">
                            <p class="eyebrow">Seguridad</p>
                            <div class="reset-hero">
                                <div class="reset-hero-mark" aria-hidden="true">NC</div>
                                <div class="reset-hero-copy">
                                    <h3>Definir nueva clave</h3>
                                    <p class="login-panel-text">Crea una clave nueva, clara para ti y dificil de adivinar para otros.</p>
                                </div>
                            </div>
                            <div class="reset-inline-note">
                                Usa al menos 8 caracteres y evita claves obvias o repetidas.
                            </div>
                        </div>
                    </div>
                    <div class="reset-panel-main">
                        {% if error %}
                        <div class="flash-message flash-message-error" role="alert" aria-live="assertive">{{ error }}</div>
                        {% endif %}
                        {% if success %}
                        <div class="flash-message" role="status" aria-live="polite">{{ success }}</div>
                        {% endif %}
                        <div class="reset-form-card">
                            <form action="/password-reset/confirm" method="post" class="inventory-form login-form reset-form" data-login-form novalidate>
                                <input type="hidden" name="token" value="{{ token }}">
                                <div class="reset-password-grid">
                                    <label class="reset-field">
                                        <span>Nueva clave</span>
                                        <div class="password-field">
                                            <input id="reset-password" type="password" name="password" autocomplete="new-password" required autofocus data-password-input>
                                            <button class="password-toggle" type="button" aria-controls="reset-password" aria-pressed="false" data-password-toggle>
                                                Mostrar
                                            </button>
                                        </div>
                                        <small class="reset-field-help">Usa una combinacion facil de recordar para ti y no reutilizada.</small>
                                    </label>
                                    <label class="reset-field">
                                        <span>Confirmar clave</span>
                                        <div class="password-field">
                                            <input id="reset-password-confirm" type="password" name="password_confirm" autocomplete="new-password" required data-password-input>
                                            <button class="password-toggle" type="button" aria-controls="reset-password-confirm" aria-pressed="false" data-password-toggle>
                                                Mostrar
                                            </button>
                                        </div>
                                    </label>
                                </div>
                                <div class="reset-actions">
                                    <button class="btn btn-primary btn-block login-submit" type="submit" data-submit-button data-submit-default="Guardar nueva clave">Guardar nueva clave</button>
                                    <a class="muted-line reset-back-link" href="/login">Volver al ingreso</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </aside>
        </section>
    </main>
    <script>
        const form = document.querySelector("[data-login-form]");
        const submitButton = document.querySelector("[data-submit-button]");
        const toggles = [...document.querySelectorAll("[data-password-toggle]")];
        toggles.forEach((toggle) => {
            toggle.addEventListener("click", () => {
                const input = document.getElementById(toggle.getAttribute("aria-controls"));
                if (!input) return;
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                toggle.textContent = show ? "Ocultar" : "Mostrar";
                toggle.setAttribute("aria-pressed", show ? "true" : "false");
            });
        });
        if (form && submitButton) {
            form.addEventListener("submit", (event) => {
                if (!form.reportValidity()) {
                    event.preventDefault();
                    return;
                }
                submitButton.disabled = true;
                submitButton.classList.add("is-loading");
                submitButton.textContent = "Guardando...";
            });
        }
    </script>
</body>
</html>
