[project]
name = "velmorax"
version = "0.1.0"
description = "Plataforma web modular para gestion clinica e inventario multiespecialidad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "itsdangerous>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
